####################
### INVENTORY UI ###
####################

# Exec this file after your ox.cfg:  exec inventory.cfg
# Everything below is optional. 1 / true = on, 0 / false = off.

### Interface

# Item rarity glow (client.lua, search for Rarity)
setr inventory:rarity 1

# Coloured edge by item type (client.lua, search for Categories)
setr inventory:itemcolours true

# Status boxes: health, armour, hunger, thirst, id, cash, bank
setr inventory:statusboxes 1

### Features

# Weapon editor: Edit in a weapon's menu fits and removes attachments
setr inventory:weaponeditor 1

# Show the real weapon in 3D, in front of a camera, inside the weapon editor (client.lua, search for WeaponView). 0 = flat picture
setr inventory:weaponview 1

# Throw and Rename in the item menu, and the Throw button. How far a throw goes and what stops it: client.lua, search for Throwing
setr inventory:throwing 1
setr inventory:rename 1

# Give opens a list of nearby players (needs giveplayerlist)
setr inventory:giveplayerlist true
setr inventory:givepanel true

# Pick up option on dropped items (needs ox_target started before ox_inventory)
setr inventory:pickup 1

# A heavy load slows your run, stops sprinting at the limit and makes you pant (client.lua, search for startsAt)
setr inventory:weightpenalty 1

# Food goes stale and tools wear out (init.lua, search for shared.condition). 0 = nothing decays or wears
setr inventory:itemcondition 1

### Logs

set inventory:logs true
set inventory:logwebhook ""
set inventory:logmoney 5000
set inventory:logweapons true
set inventory:logevidence true
set inventory:logtransfers false

# Stops the update notice pointing at the original ox_inventory, whose files would overwrite this version
set inventory:versioncheck false
